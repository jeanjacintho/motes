name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate the project
        run: cd Motes && xcodegen
      - name: Build and test
        run: cd Motes && xcodebuild -scheme Motes -configuration Debug -derivedDataPath ../build/ci test
